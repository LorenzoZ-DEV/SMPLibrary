plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'dev.lorenzzz'

def getBuildVersion() {
    try {
        def hash = 'git rev-parse --short HEAD'.execute().text.trim()
        def count = 'git rev-list --count HEAD'.execute().text.trim()
        if (hash && count) return "1.12.${count}-${hash}"
    } catch (Exception ignored) {}
    return "1.0-" + new Date().format('yyyyMMdd-HHmmss')
}
version = getBuildVersion()

/*
 * Every repository declares which groups it actually hosts.
 *
 * Without these filters Gradle walks the whole list for each artifact, so a single slow or
 * unreachable host stalls resolution of dependencies it does not even serve — which is where
 * "Connection timed out: getsockopt" comes from. repo.papermc.io in particular can take ~10s
 * to answer, and it was being asked about every group in the build.
 *
 * It also fixes a resolution surprise: papermc's maven-public mirrors an old spark-api snapshot
 * (0.1-20240720), and because it is listed first that stale copy won, not the current one from
 * lucko's own repo.
 */
repositories {
    mavenCentral()

    maven {
        url 'https://repo.papermc.io/repository/maven-public/'          // Paper / Adventure
        content {
            includeGroupByRegex 'io\\.papermc.*'
            includeGroupByRegex 'com\\.destroystokyo.*'
            // paper-api's own transitives, none of which are on Maven Central:
            includeGroup 'com.mojang'                                   // brigadier
            includeGroup 'net.md-5'                                     // bungeecord-chat
            includeGroup 'org.spigotmc'
        }
    }
    maven {
        url 'https://repo.aikar.co/content/groups/aikar/'               // ACF
        content { includeGroupByRegex 'co\\.aikar.*' }
    }
    maven {
        url 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
        content { includeGroup 'me.clip' }
    }
    maven {
        url 'https://repo.j4c0b3y.net/public/'                          // MenuAPI
        content { includeGroupByRegex 'net\\.j4c0b3y.*' }
    }
    maven {
        url 'https://repo.groupez.dev/releases'                         // zEssentials API
        content { includeGroupByRegex 'fr\\.maxlego08.*' }
    }
    maven {
        url 'https://repo.lucko.me/'                                    // spark-api (flat layout)
        content { includeGroupByRegex 'me\\.lucko.*' }
    }
    maven {
        url 'https://jitpack.io'                                        // VaultAPI, published nowhere else
        content { includeGroupByRegex 'com[.]github[.]MilkBowl.*' }
    }
}

dependencies {
    // Provided by the server at runtime:
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // zEssentials API. The plain artifact of this version is a pom with no jar attached, so
    // the classes only exist under the 'all' classifier — without it the import compiles to
    // nothing and every reference fails. compileOnly: the server provides zEssentials, and
    // TpAutoBridge is the only class that touches these types.
    compileOnly 'fr.maxlego08.essentials:zessentials-api:1.0.2.6:all'
    // Vault, for the anti-dupe watcher's cache-side balance reads. Soft dependency: the only
    // class naming these types is VaultBalanceSource, and a host without Vault passes its own
    // BalanceSource lambda instead.
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    // spark, for the live performance panel. Soft dependency: every reference to these
    // classes is confined to SparkBridge, which only loads when the plugin is installed.
    compileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'

    // Lombok — compile-time only, never shaded:
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Shaded into our jar:
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'                 // Aikar Commands (ACF)
    implementation 'com.zaxxer:HikariCP:5.1.0'                         // connection pool
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'     // C.java color cache
    implementation 'net.j4c0b3y:MenuAPI-core:1.5.5'                    // MenuAPI
    /*
     * SQLite driver, shipped rather than borrowed. StorageManager has always assumed the server
     * runtime provides org.sqlite.JDBC; where it does not, the pool fails to start and every
     * module falls back to files. The anti-dupe probe has nothing to fall back to — reading
     * zEssentials' database.db *is* the feature — so the driver comes along.
     *
     * Deliberately NOT relocated, unlike the other shaded libs. A JDBC driver is resolved by
     * class name (Class.forName, DriverManager, META-INF/services) and none of those follow a
     * package rename: a relocated driver is a driver nobody can find. Paper gives each plugin
     * its own class loader — the same reason the Anthropic SDK below stays put — so a server
     * carrying its own copy does not collide with ours.
     */
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    // Anthropic SDK, for the debug module's AI diagnosis. It drags in OkHttp + Jackson, which
    // is why both are relocated below: a server running another plugin with its own Jackson
    // must not be able to break ours, or the other way round.
    implementation('com.anthropic:anthropic-java:2.34.0') {
        // The SDK ships the machinery for features this plugin does not use, and each one is
        // megabytes in the shaded jar: JSON-schema generation (structured outputs), Swagger
        // annotations, and webhook signature verification. Dropping them keeps the plugin a
        // sane download. If a future feature here needs structured outputs or webhooks, put
        // the matching exclusion back.
        exclude group: 'com.github.victools'
        exclude group: 'com.fasterxml', module: 'classmate'
        exclude group: 'io.swagger.core.v3'
        exclude group: 'com.standardwebhooks'
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Relocate the shaded libs so we don't collide with other plugins on the server.
shadowJar {
    archiveClassifier.set('')
    relocate 'co.aikar.commands', 'dev.lorenzzz.smplibrary.lib.acf'
    relocate 'co.aikar.locales',  'dev.lorenzzz.smplibrary.lib.locales'
    relocate 'com.zaxxer.hikari', 'dev.lorenzzz.smplibrary.lib.hikari'
    relocate 'com.github.benmanes.caffeine', 'dev.lorenzzz.smplibrary.lib.caffeine'
    relocate 'net.j4c0b3y', 'dev.lorenzzz.smplibrary.lib.menuapi'

    /*
     * The Anthropic SDK and everything it stands on (OkHttp, Okio, Jackson's Kotlin module) are
     * Kotlin libraries, and Kotlin classes carry a @Metadata annotation holding their own type
     * names as plain strings. Shadow rewrites bytecode references but not those strings, so a
     * relocated build ends up with classes whose metadata still says `com.anthropic.core.*`.
     * jackson-module-kotlin reads that metadata to resolve constructors and then looks the type
     * up by name — Class.forName("com.anthropic.core.JsonField") — and gets a
     * ClassNotFoundException, which is what killed every AI analysis.
     *
     * So these four stay un-relocated. Paper gives each plugin its own classloader, so another
     * plugin shipping its own OkHttp or Jackson does not collide with ours.
     */
    /*
     * Without this, artifacts that ship the same META-INF/services file overwrite each other:
     * jackson-datatype-jdk8, jackson-datatype-jsr310 and jackson-module-kotlin all register
     * themselves through com.fasterxml.jackson.databind.Module, and only the last one to be
     * copied survived. Anything resolved through ServiceLoader — Jackson's modules, and
     * kotlin-reflect's own built-ins loader — needs the files concatenated, not replaced.
     */
    /*
     * sqlite-jdbc ships a native library for two dozen platform/architecture pairs, 24 MB of
     * them, and a Minecraft server runs on exactly one. Keeping the four that can plausibly
     * host this plugin — x86_64 and arm64 Linux, musl x86_64 for Alpine containers, Windows
     * x86_64 for local testing — takes about twenty megabytes back off the jar.
     *
     * Anywhere else the driver loads but cannot find its native library, which surfaces as
     * SqliteBalanceProbe#unusableReason and switches the anti-dupe module to its cache-only
     * checks. That is the module degrading, not the plugin breaking. Drop the matching line
     * if the server ever moves to one of these.
     */
    exclude 'org/sqlite/native/Mac/**'
    exclude 'org/sqlite/native/FreeBSD/**'
    exclude 'org/sqlite/native/Linux-Android/**'
    exclude 'org/sqlite/native/Linux/x86/**'
    exclude 'org/sqlite/native/Linux/arm/**'
    exclude 'org/sqlite/native/Linux/armv6/**'
    exclude 'org/sqlite/native/Linux/armv7/**'
    exclude 'org/sqlite/native/Linux/ppc64/**'
    exclude 'org/sqlite/native/Linux/riscv64/**'
    exclude 'org/sqlite/native/Linux-Musl/x86/**'
    exclude 'org/sqlite/native/Linux-Musl/aarch64/**'
    exclude 'org/sqlite/native/Windows/x86/**'
    exclude 'org/sqlite/native/Windows/armv7/**'
    exclude 'org/sqlite/native/Windows/aarch64/**'

    mergeServiceFiles()

    minimize {
        exclude(dependency('co.aikar:acf-paper:.*'))
        exclude(dependency('com.github.ben-manes.caffeine:caffeine:.*'))
        exclude(dependency('net.j4c0b3y:MenuAPI-core:.*'))
        // Loaded by name and never referenced: minimize sees no edge to it and would strip it.
        exclude(dependency('org.xerial:sqlite-jdbc:.*'))
        // The SDK and Jackson resolve types reflectively; minimize cannot see those edges and
        // strips classes that are only reached at runtime. The pattern has to match every
        // artifact in the SDK's own group — `anthropic-java` alone left core and client-okhttp
        // exposed to minimization.
        exclude(dependency('com.anthropic:.*:.*'))
        exclude(dependency('com.fasterxml.jackson.*:.*'))
        exclude(dependency('org.jetbrains.kotlin:.*:.*'))
        exclude(dependency('com.squareup.okhttp3:.*:.*'))
        exclude(dependency('com.squareup.okio:.*:.*'))
    }
}

tasks.assemble.dependsOn(tasks.shadowJar)
tasks.build.dependsOn(tasks.shadowJar)