name: "confirm-enderman-spawner"
translated-name: "&#555555Conferma Acquisto"
size: 27
enable: true

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 13
    item:
      material: ENDER_PEARL
      amount: 1
      name: "&#aa00ffSpawner Enderman"
      lore:
        - ""
        - " &#aaaaaaPrezzo unità: &#ffff5550 &#ffffffPistacchi"
        - " &#aaaaaaScegli la quantità da acquistare."

  buy_1:
