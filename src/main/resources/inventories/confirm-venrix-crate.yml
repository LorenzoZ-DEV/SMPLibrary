name: "confirm-venrix-crate"
title: "<gradient:#5f5f5f:#7dff7a>Conferma Acquisto</gradient>"
size: 27
enable: true

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 13
    item:
      material: ENDER_CHEST
      amount: 1
      name: "&#ff8df5Venrix Crate"
      lore:
        - ""
        - " &#d7d7d7Crate premium di fascia alta."
        - " &#fff27aPrezzo unità: &#ffffff650 Pistacchi"
        - " &#9a9a9aScegli la quantità da acquistare."

  buy_1:
    slot: 10
    item:
      material: LIME_DYE
      amount: 1
      name: "&#7dff7aCompra x1"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a1"
        - " &#fff27aTotale: &#ffffff650 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "650"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 650"
              - "crate key give %player_name% venrix_crate 1"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato <gold>1x</gold> <white>Venrix Crate</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>650</gold>.</red>"

  buy_8:
    slot: 11
    item:
      material: LIME_DYE
      amount: 8
      name: "&#7dff7aCompra x8"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a8"
        - " &#fff27aTotale: &#ffffff5200 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "5200"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 5200"
              - "crate key give %player_name% venrix_crate 8"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato <gold>8x</gold> <white>Venrix Crate</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>5200</gold>.</red>"

  buy_16:
    slot: 12
    item:
      material: LIME_DYE
      amount: 16
      name: "&#7dff7aCompra x16"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a16"
        - " &#fff27aTotale: &#ffffff10400 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "10400"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 10400"
              - "crate key give %player_name% venrix_crate 16"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato <gold>16x</gold> <white>Venrix Crate</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>10400</gold>.</red>"

  cancel:
    slot: 22
    item:
      material: BARRIER
      name: "&#ff7b7bAnnulla"
      lore:
        - ""
        - " &#5f5f5f» &#ff7b7bTorna indietro senza acquistare"
    actions:
      - type: inventory
        inventory: "pistacchi-crates"
      - type: close