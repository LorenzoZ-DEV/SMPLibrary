adaptive-tool:
  morphed: '&5⚡ &#d1e0e0Tool morphed into &#a78bfa{form}&#d1e0e0.'
  destroyed: '&5⚡ &#d1e0e0Your adaptive tool has &cshattered&#d1e0e0!'
pay:
  sent: '&d» &fHai inviato &d%amount% pistacchi &fa &d%player%&f. Saldo: &d%balance%&f.'
  received: '&d» &fHai ricevuto &d%amount% pistacchi &fda &d%player%&f. Saldo: &d%balance%&f.'
  target-offline: '&cPlayer non trovato o offline: &f%player%&c.'
  self-pay-disabled: '&cNon puoi pagare te stesso.'
  invalid-amount: '&cImporto non valido: &f%input%&c.'
  below-minimum: '&cL''importo minimo è &f%amount% pistacchi&c.'
  above-maximum: '&cL''importo massimo è &f%amount% pistacchi&c.'
  insufficient-funds: '&cNon hai abbastanza pistacchi (saldo: &f%balance%&c, richiesti: &f%amount%&c).'
  error: '&cErrore durante il trasferimento. Riprova.'
amethyst-tool:
  broken: '&d⚡ &#d1e0e0Your amethyst tool has run out of uses.'
  unknown: '&cUnknown amethyst tool: &f%tool%'
  given: '&dGave the &#d1e0e0%tool% &dto &f%player%&d.'
chat-games:
  # Ogni messaggio può avere una variante "<chiave>-actionbar": una riga breve
  # mostrata sopra l'hotbar. Se la chiave manca, l'action bar viene semplicemente saltata.
  message-box: |-
    &r
    &r
    &d&lCHATGAMES - &f%type%
    &r
    &fHai %time_left% minuti per rispondere!
    &fScrivi la risposta in chat per vincere un premio!
  message-box-actionbar: '&d&lCHATGAMES &8&l» &fNuovo gioco: &d%type%&f!'
  # Riga con la domanda/parola, una per tipo di gioco.
  word-prompt: '&aIndovina la parola! &fScrivi la parola giusta in chat: &d%word%'
  math-prompt: '&aQuanto fa &e%question%&a? &fScrivi il risultato in chat.'
  trivia-prompt: '&a%question% &fScrivi la risposta in chat.'
  # Etichette mostrate al posto di %type%.
  type:
    word: 'Parole'
    math: 'Matematica'
    trivia: 'Trivia'
  message-win-player: |-
    &r
    &r
    &d&lCHATGAMES
    &r
    &fCongratulazioni &a%player_name%&f!
    La risposta corretta era: &d%word%&f!
  message-win-player-actionbar: '&d&lCHATGAMES &8&l» &a%player_name% &fvince!'
  message-win-player-chat:
    chatgames-win: '&5&lCHATGAMES &8&l» &fEcco a te il tuo premio, &a%player_name%&f!'
  message-timeout: |-
    &r
    &d&lCHATGAMES
    &fNessuno ha risposto in tempo! La risposta era &d%word%&f.
    &fRiprova al prossimo giro!
  message-timeout-actionbar: '&d&lCHATGAMES &8&l» &cNessuno ha risposto in tempo!'
playtime:
  reward: '&#a7ff8aHai ricevuto &f%amount% &#a7ff8adollari per aver giocato nel server!'
keyall:
  # Feedback mostrato a chi lancia /keyall a mano.
  executed: '&dKeyAll &7» &fchiavi distribuite a &d%players% &fplayer.'
first-join:
  # Sent privately to the player on their FIRST join (and only then).
  # %player% / %player_name% injected; PlaceholderAPI works too if installed.
  welcome: |-
    &r
    &r
    &d&lBENVENUTO
    &r
    &fBenvenuto sul server, &d%player%&f!
    &fHai ricevuto il kitstarter: usa il comando &d/kit claim start&f.
    &fBuona avventura!
  # Riga breve mostrata sopra l'hotbar insieme al messaggio qui sopra.
  # Vale per ogni chiave: "<chiave>-actionbar" è opzionale, se manca non viene mostrata.
  welcome-actionbar: '&#F3F622&lBENVENUTO &r&8➟ &fBenvenuto sul server, &d%player%&f!'
  # Optional broadcast to everyone online on first join. Only sent when
  # MODULES.firstjoin.broadcast-first-join is true. Leave empty to disable.
  broadcast: |-
    &d&l» &f%player% &7è entrato per la prima volta sul server!
  # Sent privately to returning players on every non-first join. No kit, just this.
  returning: |-
    &r
    &d&lBENTORNATO
    &fBentornato sul server, &d%player%&f!
  returning-actionbar: '&d&lBENTORNATO &r&8➟ &fBentornato, &d%player%&f!'
