# Onda di GG: parte dall'annuncio di acquisto dello store (MODULES.ggwave).
# <player> = chi ha comprato, <seconds> = durata, <count> = gg scritti,
# <players> = quanti player hanno scritto gg. Il colore dei gg NON si configura qui:
# gli stili stanno in config.yml, sotto MODULES.ggwave.styles.
gg-wave:
  start: |-
    <newline><gradient:#ffd43e:#ff8c2e><bold>GG WAVE</bold></gradient><newline><white><yellow><player></yellow> ha appena supportato il server!<newline><gray>Scrivi <gradient:#38f9d7:#43e97b><bold>gg</bold></gradient><gray> in chat per i prossimi <white><seconds></white>s.<newline>
  start-actionbar: '<gradient:#ffd43e:#ff8c2e><bold>GG WAVE</bold></gradient> <dark_gray>»</dark_gray> <white>scrivi <bold>gg</bold>!'
  # Titolo a schermo. Cancella queste due chiavi per non mostrarlo.
  title: '<gradient:#ffd43e:#ff8c2e><bold>GG WAVE</bold></gradient>'
  subtitle: '<white>grazie <yellow><player></yellow><gray>, scrivi gg!'
  end: '<prefix><white>Onda finita: <gradient:#38f9d7:#43e97b><bold><count> gg</bold></gradient> <white>da <yellow><players></yellow> player. Grazie <yellow><player></yellow>!'
  end-actionbar: '<gradient:#38f9d7:#43e97b><bold><count> gg</bold></gradient> <gray>da <players> player'
  end-empty: '<prefix><gray>Onda finita senza un gg. Duro.'
