name: smp-library
version: '${version}'
main: dev.lorenzzz.smplibrary.Smp_library
api-version: '1.21'
softdepend:
  - PlaceholderAPI
  - zEssentials
  - HuskHomes
  - spark
  # ZelChat formatta la chat: l'onda di GG si registra come suo modulo per non buttare via
  # prefissi e gradi. Senza, il modulo ripiega su AsyncChatEvent e funziona lo stesso.
  - ZelChat
author:
  Lorenzzzzzz
website:
  "https://lorenzzzz.xyz"
permissions:
  smplibrary.*:
    children:
      smplibrary.admin: true
      smplibrary.menu.use: true
      smplibrary.pay.use: true
      smplibrary.bugreport.use: true
      smplibrary.tpauto.use: true
      smplibrary.gui.homes: true
      smplibrary.gui.warps: true
      smplibrary.nightvision.use: true
  smplibrary.admin:
    description: Access to admin log chat broadcast and dashboard actions
    default: op
  smplibrary.menu.use:
    description: Open in-game menus
    default: true
  smplibrary.pay.use:
    description: Transfer pistacchi to other players with /pay
    default: true
  smplibrary.bugreport.use:
    description: File a bug report with /bugreport
    default: true
  smplibrary.tpauto.use:
    description: Toggle TPAuto, which accepts incoming teleport requests for you
    default: true
  smplibrary.gui.homes:
    description: Open the homes GUI
    default: true
  smplibrary.gui.warps:
    description: Open the warps GUI
    default: true
  smplibrary.antidupe.notify:
    description: Receive the anti-dupe alerts in chat
    default: op
  smplibrary.dialogguard.bypass:
    description: Never get a guarded dialog re-opened after a relog
    default: false
  # Le funzioni portate da venrix-utils. Vanno dichiarate qui: un nodo che plugin.yml non
  # conosce vale 'op' per default, quindi finche' mancavano ogni operatore saltava in
  # automatico il combat tag e l'attesa dello /spawn, senza che nessuno glielo desse.
  smplibrary.combat.bypass:
    description: Never get combat tagged, and ignore the in-combat restrictions
    default: false
  smplibrary.spawn.bypass:
    description: Teleport to spawn instantly, without the countdown or the move check
    default: false
  smplibrary.spawn.set:
    description: Move the server spawn point with /setspawn
    default: op
  smplibrary.nightvision.use:
    description: Toggle your own night vision with /nv
    default: true
  smplibrary.nightvision.others:
    description: Toggle night vision on another player with /nv <player>
    default: op
  smplibrary.ggwave.admin:
    description: Start or stop the GG wave by hand with /ggwave
    default: op
  antipearlglitch.bypass:
    description: Ender pearls are never corrected for this player
    default: false
  antipearlglitch.notify:
    description: Receive the anti-pearl-glitch staff alerts
    default: op
commands:
  pistacchi:
    aliases: [pshop]
    permission: smplibrary.menu.use
  settings:
    aliases: [impostazioni]
    permission: smplibrary.menu.use
  pistacchiopay:
    aliases: [pistacchipay, pagapers]
    permission: smplibrary.pay.use
  bugreport:
    aliases: [segnalabug]
    permission: smplibrary.bugreport.use
  tpauto:
    description: Accetta automaticamente le richieste di teleport ricevute
    usage: "/tpauto [on|off]"
    aliases: [autotp, tpautomatico]
    permission: smplibrary.tpauto.use
  # Non si chiamano /homes e /warps perche' quei due sono di HuskHomes: registrarli qui
  # significherebbe litigarseli col plugin che possiede i dati. La GUI si prende comunque
  # quei comandi, ma per intercettazione — vedi 'intercept' in inventories/gui.yml.
  homegui:
    description: Apre la GUI delle tue home (HuskHomes)
    usage: "/homegui"
    aliases: [homesgui, guihome, guihomes, casegui]
    permission: smplibrary.gui.homes
  warpgui:
    description: Apre la GUI dei warp (HuskHomes)
    usage: "/warpgui"
    aliases: [warpsgui, guiwarp, guiwarps]
    permission: smplibrary.gui.warps
