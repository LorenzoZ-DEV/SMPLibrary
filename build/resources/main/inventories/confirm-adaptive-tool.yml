name: "confirm-adaptive-tool"
title: "<gradient:#5f5f5f:#7dff7a>Conferma Acquisto</gradient>"
size: 27
enable: true

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 13
    item:
      material: NETHERITE_PICKAXE
      amount: 1
      name: "&#6fe8ffAdaptive Tool"
      lore:
        - ""
        - " &#d7d7d7Tool premium versatile e veloce."
        - " &#9a9a9aQuantità: &#7dff7a1"
        - " &#fff27aTotale: &#ffffff250 Pistacchi"

  confirm:
    slot: 11
    item:
      material: LIME_DYE
      amount: 1
      name: "&#7dff7aConferma acquisto"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a1"
        - " &#fff27aTotale: &#ffffff250 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "250"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 250"
              - "sl adaptive give %player_name%"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato l'<white>Adaptive Tool</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>250</gold>.</red>"

  cancel:
    slot: 15
    item:
      material: BARRIER
      name: "&#ff7b7bAnnulla"
      lore:
        - ""
        - " &#5f5f5f» &#ff7b7bTorna indietro senza acquistare"
    actions:
      - type: inventory
        inventory: "pistacchi-tools"
      - type: close
