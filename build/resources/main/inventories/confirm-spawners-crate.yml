name: "confirm-spawners-crate"
translated-name: "&#555555Conferma Acquisto"
size: 27
enable: true

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 13
    item:
      material: SPAWNER
      amount: 1
      name: "&#55ff55Crate Spawners"
      lore:
        - ""
        - " &#aaaaaaPrezzo unità: &#ffff5580 &#ffffffPistacchi"
        - " &#aaaaaaScegli la quantità da acquistare."

  buy_1:
