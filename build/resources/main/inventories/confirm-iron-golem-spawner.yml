name: "confirm-iron-golem-spawner"
title: "<gradient:#5f5f5f:#7dff7a>Conferma Acquisto</gradient>"
size: 27
enable: true

fillItem:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  preview:
    slot: 13
    item:
      material: IRON_BLOCK
      amount: 1
      name: "&#f4f4f4Spawner Iron Golem"
      lore:
        - ""
        - " &#d7d7d7Spawner premium per ferro costante."
        - " &#fff27aPrezzo unità: &#ffffff350 Pistacchi"
        - " &#9a9a9aScegli la quantità da acquistare."

  buy_1:
    slot: 10
    item:
      material: LIME_DYE
      amount: 1
      name: "&#7dff7aCompra x1"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a1"
        - " &#fff27aTotale: &#ffffff350 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "350"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 350"
              - "neospawner givems %player_name% iron_golem 1"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato <gold>1x</gold> <white>Spawner Iron Golem</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>350</gold>.</red>"

  buy_4:
    slot: 11
    item:
      material: LIME_DYE
      amount: 4
      name: "&#7dff7aCompra x4"
      lore:
        - ""
        - " &#9a9a9aQuantità: &#7dff7a4"
        - " &#fff27aTotale: &#ffffff1400 Pistacchi"
        - ""
        - " &#5f5f5f» &#7dff7aClicca per acquistare"
    click-requirement:
      purchase:
        clicks: [ALL]
        requirements:
          - type: placeholder
            placeholder: "%zessentials_user_balance_coins%"
            value: "1400"
            action: "SUPERIOR_OR_EQUAL"
        success:
          - type: console_command
            commands:
              - "eco take coins %player_name% 1400"
              - "neospawner givems %player_name% iron_golem 4"
          - type: message
            messages:
              - "<green><bold>SUCCESSO</bold> <white>» <green>Hai acquistato <gold>4x</gold> <white>Spawner Iron Golem</white>!</green>"
          - type: close
        deny:
          - type: message
            messages:
              - "<red><bold>ERRORE</bold> <white>» <red>Non hai abbastanza <gold>Pistacchi</gold>! Ti servono almeno <gold>1400</gold>.</red>"

  buy_8:
