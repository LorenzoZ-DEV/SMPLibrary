####################################################
#   GUI IMPOSTAZIONI PLAYER
####################################################
# Inventario vero e proprio (prima era un Dialog di Paper).
#
# Ogni voce accetta:
#   slot            posizione nell'inventario (0 = primo slot in alto a sinistra)
#   toggle          true  = interruttore ON/OFF, lo stato viene salvato per player
#                   false = pulsante che esegue e basta (es. "apri un'altra GUI")
#   default         stato di partenza dell'interruttore per chi non l'ha mai toccato
#   commands        comandi eseguiti come il player ad ogni clic (%player% = il suo nome)
#   close           chiude la GUI dopo il clic; vale solo per le voci con toggle: false,
#                   un interruttore resta aperto per farti vedere il nuovo stato
#   requires-module la voce compare solo se quel modulo di smp-library e' attivo
#
# Dentro name/lore puoi usare %state%: viene sostituito con le etichette qui sotto.
# Se non lo usi, lo stato viene aggiunto in fondo alla lore da solo.

size: 27
name: "&#8b00ff&lIMPOSTAZIONI"

status:
  enabled: "&a&lATTIVO"
  disabled: "&c&lDISATTIVO"

fillItem:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:

  tpa_toggle:
    slot: 11
    item:
      material: ENDER_PEARL
      name: "&#e74c3c&lTELETRASPORTO (TPA)"
      lore:
        - ""
        - " &7Gestisci le richieste di TPA."
        - " &7Attiva o disattiva i teletrasporti."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "tptoggle"

  # Slot 10 e non 11: gli 11..16 erano gia' occupati prima che TPAuto esistesse, e la
  # voce viene aggiunta anche ai server che hanno gia' un settings.yml loro.
  tpauto:
    slot: 10
    # Nessun comando: l'interruttore E' lo stato che legge il modulo tpauto.
    item:
      material: COMPASS
      name: "&#8e44ad&lTPAUTO"
      lore:
        - ""
        - " &7Accetta da solo le richieste di TPA"
        - " &7che ricevi: chi ti manda /tpa viene"
        - " &7teletrasportato senza che tu faccia nulla."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands: []
    default: false
    requires-module: tpauto

  msg_toggle:
    slot: 12
    item:
      material: WRITABLE_BOOK
      name: "&#e67e22&lMESSAGGI PRIVATI"
      lore:
        - ""
        - " &7Gestisci i messaggi privati."
        - " &7Attiva o disattiva la ricezione dei msg."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "togglemsg"

  sb_toggle:
    slot: 13
    item:
      material: MAP
      name: "&#2ecc71&lSCOREBOARD"
      lore:
        - ""
        - " &7Mostra o nascondi la Scoreboard."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "sb"

  chat_toggle:
    slot: 14
    item:
      material: PAPER
      name: "&#3498db&lCHAT PUBBLICA"
      lore:
        - ""
        - " &7Mostra o nascondi la chat globale."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "togglechat"

  pay_toggle:
    slot: 15
    item:
      material: GOLD_INGOT
      name: "&#f1c40f&lPAGAMENTI"
      lore:
        - ""
        - " &7Gestisci i pagamenti automatici."
        - " &7Attiva o disattiva la ricezione di denaro."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "paytoggle"

  mention_toggle:
    slot: 16
    item:
      material: BELL
      name: "&#9b59b6&lMENZIONI"
      lore:
        - ""
        - " &7Ricevi notifiche quando"
        - " &7qualcuno ti menziona in chat."
        - ""
        - " &8» &aClicca per attivare/disattivare"
    commands:
      - "togglementions"

  ah_options:
    slot: 22
    toggle: false
    item:
      material: EMERALD
      name: "&#1abc9c&lOPZIONI ASTE"
      glow: true
      lore:
        - ""
        - " &7Apri la GUI delle"
        - " &7opzioni dell'Auction House."
        - ""
        - " &8» &aClicca per aprire"
    commands:
      - "ah options"
    close: true
