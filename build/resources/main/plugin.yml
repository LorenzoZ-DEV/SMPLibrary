name: smp-library
version: '1.12.17-12e29e6'
main: dev.lorenzzz.smplibrary.Smp_library
api-version: '1.21'
softdepend:
  - PlaceholderAPI
  - zEssentials
  - spark
author:
  Lorenzzzzzz
website:
  "https://lorenzzzz.xyz"
permissions:
  smplibrary.*:
    children:
      smplibrary.admin: true
      smplibrary.menu.use: true
      smplibrary.pay.use: true
      smplibrary.bugreport.use: true
      smplibrary.tpauto.use: true
  smplibrary.admin:
    description: Access to admin log chat broadcast and dashboard actions
    default: op
  smplibrary.menu.use:
    description: Open in-game menus
    default: true
  smplibrary.pay.use:
    description: Transfer pistacchi to other players with /pay
    default: true
  smplibrary.bugreport.use:
    description: File a bug report with /bugreport
    default: true
  smplibrary.tpauto.use:
    description: Toggle TPAuto, which accepts incoming teleport requests for you
    default: true
  smplibrary.dialogguard.bypass:
    description: Never get a guarded dialog re-opened after a relog
    default: false
  antipearlglitch.bypass:
    description: Ender pearls are never corrected for this player
    default: false
  antipearlglitch.notify:
    description: Receive the anti-pearl-glitch staff alerts
    default: op
commands:
  pistacchi:
    aliases: [pshop]
    permission: smplibrary.menu.use
  settings:
    aliases: [impostazioni]
    permission: smplibrary.menu.use
  pistacchiopay:
    aliases: [pistacchipay, pagapers]
    permission: smplibrary.pay.use
  bugreport:
    aliases: [segnalabug]
    permission: smplibrary.bugreport.use
  tpauto:
    description: Accetta automaticamente le richieste di teleport ricevute
    usage: "/tpauto [on|off]"
    aliases: [autotp, tpautomatico]
    permission: smplibrary.tpauto.use
