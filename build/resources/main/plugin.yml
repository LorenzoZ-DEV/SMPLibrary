name: smp-library
version: '1.0.6-b32d6f1'
main: dev.lorenzzz.smplibrary.Smp_library
api-version: '1.21'
softdepend:
  - PlaceholderAPI
  - zEssentials
author:
  Lorenzzzzzz
website:
  "https://lorenzzzz.xyz"
permissions:
  smplibrary.*:
    children:
      smplibrary.admin: true
      smplibrary.menu.use: true
  smplibrary.admin:
    description: Access to admin log chat broadcast and dashboard actions
    default: op
  smplibrary.menu.use:
    description: Open in-game menus
    default: true
commands:
  pistacchi:
    aliases: [pshop]
    permission: smplibrary.menu.use
  settings:
    aliases: [impostazioni]
    permission: smplibrary.menu.use
