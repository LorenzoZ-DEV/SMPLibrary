  MODULES:
    keyall:
      enabled: true
      task-every: 1h
      amount: 1
      crate-name: "common_crate"
      command: "crate key give %player% %crate-name% %amount%"
      placeholder: "%smplibrary_keyall_formatted%"
      # Quanti player servire per tick. Le chiavi non vengono piu' consegnate tutte nello
      # stesso tick: con 200 player online erano 200 comandi console in un colpo solo.
      batch-size: 10
    chatgames:
      enabled: true
      task-every: 30m            # how often a new game starts
      time-limit: 3             # minutes players have to guess before it times out
      scramble: true            # scramble the word in the prompt (harder)
      type: "Parole"            # label shown via %type% in messages
      reward: "crate key give %player% common_crate 1"
      game-types:                # available game types: WORD, MATH, TRIVIA
        - WORD
        - MATH
        - TRIVIA
      # Suoni riprodotti a tutti i player online. Il blocco e' opzionale: senza,
      # valgono i default qui sotto. Accetta sia 'block.note_block.pling' che
      # 'BLOCK_NOTE_BLOCK_PLING'. Usa enabled: false per silenziarne uno.
      sounds:
        start:
          type: block.note_block.pling
          volume: 0.8
          pitch: 1.2
          enabled: true
        win:
          type: entity.player.levelup
          volume: 0.7
          pitch: 1.4
          enabled: true
        timeout:
          type: block.note_block.bass
          volume: 0.7
          pitch: 0.8
          enabled: true
      words:
        - "ananas"
        - "diamante"
        - "creeper"
        - "redstone"
        - "villager"
        - "netherite"
        - "endereeit"
        - "fornace"
        - "beacon"
        - "shulker"
        - "phantom"
        - "warden"
      math:
        max-number: 100
        operations: "+-"
      trivia:
        questions:
          - question: "Qual è la capitale dell'Italia?"
            answers: ["roma"]
          - question: "Quanti blocchi è alto un Creeper?"
            answers: ["1.8", "1,8", "2"]
          - question: "Quale minerale si trova più in profondità?"
            answers: ["diamond", "diamante", "diamanti"]
          - question: "Quanti bastoni servono per un pickaxe di legno?"
            answers: ["2"]
          - question: "Come si chiama il boss del Nether?"
            answers: ["wither", "vithered"]
          - question: "Quale strumento serve per rompere la pietra più velocemente?"
            answers: ["pickaxe", "piccone", "picco"]
    shop:
      enabled: true
      # Economia zEssentials usata dal negozio e da /pistacchipay (pistacchi).
      # Deve corrispondere al nome di un'economia in zEssentials (default: coins).
      economy: coins
    pay:
      enabled: true
      minimum-amount: 1.0        # importo minimo trasferibile in pistacchi
      maximum-amount: 1000000.0  # tetto per singolo trasferimento (0 = nessun limite)
      allow-self: false         # permetti /pay a te stesso (utile solo per test)
      currency-decimals: 0      # cifre decimali mostrate nei messaggi (0 = interi)
      # Pausa fra due /pay dello stesso player. Non e' quello che rende sicuro il
      # trasferimento — a quello pensano l'id univoco e il lock sul portafoglio — e'
      # solo una protezione in piu' contro chi martella il comando. 0 la disattiva.
      cooldown-seconds: 1.0
    playtime:
      enabled: true
      every: 5m
      amount: 100.0
      # Quanti player servire per tick. Il pagamento non avviene piu' tutto nello stesso
      # tick: la lista viene spalmata su piu' tick cosi' 300 player online non diventano
      # 300 operazioni economiche in un colpo solo.
      batch-size: 20
    playerstats:
      # Storico dei player online, mostrato come grafico nella web dashboard.
      enabled: true
      sample-every: 1m       # ogni quanto viene registrato il numero di player
      retention-days: 7      # per quanti giorni i campioni restano nel database
      # Record storico di player contemporanei, mostrato nella dashboard con una barra
      # di progresso sugli online attuali. Serve a dichiarare un record raggiunto prima
      # che il plugin lo registrasse: e' un minimo, non un valore fisso. Il modulo lo
      # alza da solo (e lo salva nel database) appena qualcuno lo supera.
      record: 45
    competitors:
      # Sezione "Concorrenza" della dashboard: pinga gli IP dei server rivali con lo stesso
      # handshake che usa il client Minecraft, li mette in classifica insieme al tuo server e
      # avvisa quando uno di loro ti supera come player online.
      enabled: true
      check-every: 2m        # ogni quanto vengono ripingati (minimo 30s)
      timeout-ms: 3000       # attesa massima per ogni server prima di darlo per offline
      your-name: "VenrixMC"   # come compare il tuo server in classifica
      # I rivali si aggiungono e si tolgono dalla dashboard, che riscrive questa lista.
      # Puoi anche compilarla a mano: 'ip' accetta host o host:porta (senza porta viene
      # seguito il record SRV, esattamente come farebbe un giocatore).
      servers: []
      # servers:
      #   - name: "Server rivale"
      #     ip: "play.rivale.it"
      #   - name: "Altro rivale"
      #     ip: "mc.altro.it:25566"
    amethyst-tool:
      enabled: true
      durability-uses: 500
      tools-list:
        amethyst_sword:
          material: DIAMOND_SWORD
          name: '&d&lAmethyst Sword'
          lore:
            - '&#d1e0e0Amethyst sword'
            - '&#d1e0e0Uses remaining: &#1a55a2%uses%'
          enchantments:
            SHARPNESS: 6
          attributes:
            GENERIC_ATTACK_DAMAGE: 12.0
        amethyst_pickaxe:
          material: DIAMOND_PICKAXE
          name: '&d&lAmethyst Pickaxe'
          lore:
            - '&#d1e0e0Amethyst pickaxe'
            - '&#d1e0e0Uses remaining: &#1a55a2%uses%'
          enchantments:
            EFFICIENCY: 7
            FORTUNE: 4
          attributes:
            GENERIC_ATTACK_SPEED: 1.5
    adaptive-tool:
      enabled: true
      max-uses: 1500
      default-form: pickaxe
      name: '&5&lAdaptive Tool'
      lore:
        - '&#d1e0e0Morphs into the perfect tool'
        - '&#d1e0e0for the block you target.'
        - ''
        - '&#d1e0e0Uses left: &#a78bfa{uses}&7/&#a78bfa{max}'
        - ''
      forms:
        sword:
          material: NETHERITE_SWORD
          enchantments:
            SHARPNESS: 5
            UNBREAKING: 3
            SWEEPING: 3
        pickaxe:
          material: NETHERITE_PICKAXE
          enchantments:
            EFFICIENCY: 5
            FORTUNE: 3
            UNBREAKING: 3
        axe:
          material: NETHERITE_AXE
          enchantments:
            EFFICIENCY: 5
            UNBREAKING: 3
        shovel:
          material: NETHERITE_SHOVEL
          enchantments:
            EFFICIENCY: 5
            UNBREAKING: 3
        hoe:
          material: NETHERITE_HOE
          enchantments:
            EFFICIENCY: 5
            UNBREAKING: 3
      particles:
        # Alcune particelle richiedono un dato extra, altrimenti il server rifiuta di
        # disegnarle. Se ne serve uno e manca, il modulo avvisa in console e usa il
        # default invece di crashare. Chiavi accettate a seconda del tipo:
        #   DRAGON_BREATH / SCULK_CHARGE -> data: <numero>  (potenza / angolo in radianti)
        #   SHRIEK                       -> data: <tick di ritardo>
        #   DUST                         -> color: "#ff00ff" + size: 1.0
        #   DUST_COLOR_TRANSITION        -> color + to-color + size
        #   ENTITY_EFFECT / FLASH        -> color: "#ff00ff"
        #   BLOCK / FALLING_DUST / ...   -> block: STONE
        #   ITEM                         -> item: DIAMOND
        type: DRAGON_BREATH
        data: 1.0              # potenza del soffio: 0 non disegna nulla
        count: 30
        offset-x: 0.5
        offset-y: 1.0
        offset-z: 0.5
        speed: 0.05
      sound:
        type: ENTITY_ENDER_DRAGON_FLAP
        volume: 0.6
        pitch: 1.5

    trivella:
      enabled: true
      radius: 1                 # 1 = cubo 3x3x3, 2 = 5x5x5; limitato a 3 nel codice
      # Con true il cubo parte dal blocco rotto e va avanti nella direzione in cui scavi,
      # cosi' tutti e 3 gli strati finiscono nel materiale. Con false il cubo e' centrato
      # sul blocco: lo strato davanti e' gia' aria e in pratica scavi 3x3x2.
      dig-forward: true
      # Con true, scavare accovacciati rompe un blocco solo: e' l'unico modo di fare un
      # tunnel 1x1 con la trivella in mano. Metti false per l'area sempre attiva.
      disable-on-sneak: true
      # COMPATIBILITY: ogni blocco del cubo passa per il suo BlockBreakEvent, quindi claim,
      #   WorldGuard, CoreProtect e le quest lo vedono esattamente come una rottura a mano.
      #   E' il default e nella quasi totalita' dei casi va lasciato cosi'.
      # FAST: i blocchi secondari vengono rotti senza evento — una passata costa 1 evento
      #   invece di 27, ma nessun plugin di protezione puo' piu' dire la sua. Mettilo solo
      #   su un server che non ha protezioni ne' logging dei blocchi.
      mode: COMPATIBILITY
      material: NETHERITE_PICKAXE
      name: '&d&lTrivella'
      lore:
        - '&#d1e0e0Scava un cubo 3x3x3 nella direzione in cui punti.'
        - '&#d1e0e0Accovacciati per scavare un blocco solo.'
        - '&#d1e0e0Illimitata — nessun consumo usi.'
      enchantments:
        EFFICIENCY: 7
        UNBREAKING: 3
        FORTUNE: 3

    lootguard:
      # Il loot per terra non viene piu' distrutto dalle esplosioni di crystal e anchor.
      #
      # In vanilla un'esplosione danneggia gli item entity, e un item ha cosi' poca vita che
      # un colpo solo lo cancella: in un fight a crystal la roba di chi muore sparisce prima
      # che qualcuno possa raccoglierla. Qui quel danno viene annullato e basta: l'esplosione
      # avviene lo stesso, fa male ai player, rompe i blocchi e sparacchia in giro gli item —
      # solo che gli item sopravvivono. Lava, fuoco, cactus, void e despawn restano invariati.
      enabled: true
      # Da quali esplosioni proteggere. Solo queste: TNT e creeper continuano a comportarsi
      # come si aspetta il server.
      #
      # BAD_RESPAWN_POINT e' il tipo di danno dietro le anchor: serve perche' l'anchor si
      # consuma esplodendo, quindi quando il colpo arriva quel blocco e' gia' aria e col solo
      # nome RESPAWN_ANCHOR non lo riconosceresti sempre. Copre anche i letti che esplodono
      # nel Nether e nell'End — stessa meccanica, stesso uso in un fight. Toglilo se vuoi
      # proteggere solo le anchor.
      #
      # Puoi aggiungerne altre con lo stesso nome che hanno in gioco: TNT, CREEPER, WITHER...
      sources:
        - END_CRYSTAL
        - RESPAWN_ANCHOR
        - BAD_RESPAWN_POINT
      # Con true anche le sfere di esperienza sopravvivono all'esplosione: e' la stessa
      # perdita, i livelli di chi muore altrimenti evaporano insieme al loot.
      protect-experience: true

    antipearlglitch:
      # Impedisce che una perla ti faccia atterrare dentro un blocco. Due controlli:
      # sul teletrasporto (se il punto d'arrivo e' occupato ti sposta, e se non c'e'
      # posto annulla la perla) e sul tick dopo, se sei rimasto incastrato.
      enabled: true
      # I player con antipearlglitch.bypass non vengono toccati.
      admin-bypass: true
      # Per quanti ms dopo una perla il controllo "sei dentro un blocco" resta attivo.
      # Piu' e' alto, piu' a lungo il modulo guarda le collisioni di quel player;
      # troppo alto e inizia a intercettare acqua, scale e piante.
      time-window-ms: 1000
      # Quanti blocchi in avanti cercare un punto libero prima di annullare la perla.
      search-distance: 3
      # Ricontrolla dove il player e' finito davvero 1 e 5 tick dopo la perla, e lo
      # estrae se la sua hitbox e' dentro un blocco. Guarda il risultato invece della
      # causa, quindi prende anche le strade che il controllo sulla destinazione non
      # vede. Lascialo acceso: e' due controlli per perla, non per tick.
      post-landing-check: true
      # Avviso a chi ha antipearlglitch.notify. MiniMessage, {player} = chi ha tirato.
      # Vuoto = nessun avviso.
      staff-message: "<gray>[<red>Anti-Glitch<gray>] <white>{player} <gray>e' stato spostato da una perla dentro un blocco."

    settings:
      enabled: true
      # Suono del clic su un interruttore della GUI /settings.
      sound:
        type: ui.button.click
        volume: 0.6
        pitch: 1.4
        enabled: true

    tpauto:
      # TPAuto: con l'interruttore acceso, ogni richiesta di teleport che ricevi viene
      # accettata al posto tuo tramite l'API di HuskHomes (stesso warmup, stessi controlli
      # e stessi messaggi di /tpaccept). Si accende da /settings o con /tpauto.
      #
      # Le richieste vengono prese al volo dall'evento di HuskHomes, quindi il teletrasporto
      # parte nello stesso istante in cui l'altro scrive /tpa: non c'e' nessuna attesa.
      enabled: true
      # Rete di sicurezza dietro l'evento: ogni quanti tick vengono ricontrollate le
      # richieste rimaste in sospeso (per esempio quelle arrivate PRIMA che accendessi
      # TPAuto). Il giro tocca solo i player che hanno l'interruttore acceso.
      check-every-ticks: 20
      # NOTA: TPAuto accetta solo le /tpa, mai le /tpahere, e non e' configurabile.
      # Le due vanno in direzioni opposte: accettare una /tpa porta l'altro da te,
      # accettare una /tpahere sposta TE da lui. L'interruttore vuol dire "gli altri
      # possono venire da me", quindi un si' automatico non puo' teletrasportare chi
      # l'ha acceso. Se avevi 'accept-teleport-here' in questo file ora e' ignorato.

    gui:
      # Le schermate /homegui e /warpgui, disegnate sui dati di HuskHomes.
      # Tutto l'aspetto (titoli, layout, materiali, testi, suoni) sta in
      # inventories/gui.yml, modificabile anche dalla dashboard web.
      enabled: true

    firstjoin:
      enabled: true
      # Commands run ONCE on a player's first join, as the player themselves.
      # No leading slash. %player% is replaced with the joining player's name.
      # Leave for a server with a kit plugin; the default claims a "start" starter kit.
      commands:
        - "kit claim start"
      # When true, first join also broadcasts first-join.broadcast to the whole server.
      # Default false: the welcome is sent only to the joining player ("a te stesso").
      broadcast-first-join: false

    anti-pearl-glitch:
      enabled: true
      admin-bypass: false
      time-window-ms: 50
      staff-message: <#fa1b1b><bold>[APG]</bold> <gray>» <gray>Il player <white>{player}
        <gray>ha tentato un Pearl Glitch ed è stato bloccato.

    debug:
      # Sezione "Debug" della dashboard: errori del plugin, segnalazioni dei player
      # e analisi AI della causa. Visibile solo a chi ha il token della dashboard
      # (e in gioco a chi ha smplibrary.admin).
      enabled: true
      # Con true gli errori del plugin NON finiscono piu' in console come stacktrace:
      # vengono raccolti nella sezione Debug e in console resta una riga sola.
      # Vengono intercettati solo gli errori che coinvolgono smp-library: quelli
      # degli altri plugin restano dove sono.
      quiet-console: true
      # Avvisa in chat gli admin online quando arriva un errore nuovo, una
      # segnalazione o il risultato di un'analisi. Ogni admin puo' silenziarsi
      # con /smpl debug notify.
      notify-admins: true
      # Righe di logs/latest.log allegate all'analisi (50-2000).
      log-lines: 300
      # Quanto puo' restare aperta una segnalazione a meta' prima di scadere.
      session-timeout-seconds: 300
      # Categorie proposte nel dialog di /bugreport.
      report-types:
        - "blocchi"
        - "redstone"
        - "mob"
        - "item"
        - "comandi"
        - "performance"
        - "altro"
      # Domini accettati per il link a screenshot/video. Un link fuori da questa
      # lista viene rifiutato: il player puo' sempre scrivere "salta".
      media-hosts:
        - "medal.tv"
        - "gyazo.com"
        - "imgur.com"
        - "youtube.com"
        - "youtu.be"
        - "streamable.com"
      ai:
        # Provider default: DeepSeek (https://platform.deepseek.com/api_keys),
        # gateway OpenAI-compatible. La chiave si crea su platform.deepseek.com.
        #
        # Ordine di lettura della chiave: variabile d'ambiente DEEPSEEK_API_KEY
        # (OPENCODE_API_KEY resta come fallback per compatibilita'), poi questo campo.
        # Per DeepSeek non c'e' nessuna chiave compilata nel jar: va messa qui
        # o nella variabile d'ambiente, altrimenti l'analisi risponde 401.
        api-key: ""
        # Qualsiasi endpoint "chat completions" in stile OpenAI va bene: il
        # plugin non ha niente di specifico per DeepSeek. Vuoto = DeepSeek (default).
        # Per cambiare provider bastano queste tre righe, senza ricompilare:
        #
        #   OpenCode Zen
        #     endpoint: "https://opencode.ai/zen/v1/chat/completions"
        #     model: "muse-spark-1.3-contributor-free"   chiave: opencode.ai/auth
        #
        #   Gemini (free tier ampio, context 1M — consigliato come alternativa)
        #     endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        #     model: "gemini-2.5-flash"          chiave: aistudio.google.com/api-keys
        #
        #   Cerebras
        #     endpoint: "https://api.cerebras.ai/v1/chat/completions"
        #
        #   OpenRouter (un'unica chiave, molti modelli con suffisso :free)
        #     endpoint: "https://openrouter.ai/api/v1/chat/completions"
        #
        #   Ollama in locale (gratis, nessuna chiave, ma consuma RAM del server)
        #     endpoint: "http://localhost:11434/v1/chat/completions"
        #
        # ATTENZIONE alla context window: le evidenze arrivano a ~180.000
        # caratteri (~50k token), quindi un modello da 32k non le regge e i
        # provider con tetti giornalieri bassi si esauriscono in poche analisi.
        endpoint: "https://api.deepseek.com/chat/completions"
        # deepseek-v4-flash = economico, deepseek-v4-pro = piu' capace.
        # I vecchi deepseek-chat / deepseek-reasoner sono ritirati dal 24/07/2026 (404).
        model: "deepseek-v4-flash"
        max-tokens: 16000
        # Anche sul modello gratuito ogni analisi consuma quota: di default parte
        # solo quando la chiedi tu (bottone nella dashboard o /smpl debug analyze).
        auto-analyze: false
        auto-cooldown-seconds: 1800

    dupewatch:
      # Anti-dupe economia: confronta di continuo il saldo in RAM con quello scritto
      # davvero nel database di zEssentials, misura quanto ci mette a persistersi e
      # segnala le divergenze. Rileva e basta: non blocca niente e non punisce nessuno.
      #
      # Database, prefisso tabelle ed elenco economie NON si configurano qui: vengono
      # letti da plugins/zEssentials (config.yml + modules/economy/config.yml), cosi'
      # restano allineati quando li cambi di la'.
      enabled: true
      # zessentials = legge tutte le economie (consigliato)
      # vault       = legge solo quella con vault: true, le altre restano non controllate
      balance-source: zessentials
      # Vuoto = tutte quelle dichiarate da zEssentials. Riempilo solo per guardarne meno.
      economies: []
      # Differenza sotto la quale due saldi sono considerati uguali.
      tolerance: 0.01
      # Aumento oltre il quale un saldo cresciuto senza trasferimenti osservati viene segnalato.
      unexplained-gain-threshold: 1000000
      # Oltre questi secondi dal quit il flush e' "lento" (StorageLagA)...
      expected-flush-seconds: 5
      # ...e oltre questi non e' mai arrivato (MoneyDupeA).
      flush-timeout-seconds: 30
      # Quanto aspettare prima di verificare i due lati di un /pay. DEVE essere piu' lungo
      # del menu di conferma di zEssentials, altrimenti misuri un pagamento non ancora fatto.
      pay-verify-seconds: 20
      # Ogni quanto ricontrollare i saldi degli online, e quanto dopo il join.
      audit-interval-seconds: 30
      join-verify-seconds: 3
      # Quante anomalie tiene in memoria il pannello web.
      history: 100
      # Comando di trasferimento -> economia che muove. Serve per capire quale saldo guardare.
      pay-commands:
        pay: money
        epay: money
        pistacchiopay: coins
        pistacchipay: coins
        pagapers: coins
      notify:
        # Chi vede gli avvisi in chat.
        permission: smplibrary.antidupe.notify
        # Secondi minimi fra due avvisi identici. Il VL continua a salire lo stesso.
        cooldown-seconds: 30
        # Ogni quanti minuti i violation level vengono dimezzati.
        decay-minutes: 30
        # Con true ogni anomalia finisce anche in console: e' la traccia che sopravvive al riavvio.
        console: true

    web:
      enabled: true
      host: "0.0.0.0"
      port: 8080
      # token: "auto-generated-if-empty"

  # Guardia dei dialog (Dialog API di Paper).
  #
  # Il pulsante col simbolo di pericolo nella schermata di un dialog e' l'uscita di
  # sicurezza del client: apre il "disconnetti" e NON si puo' togliere lato server.
  # Questa sezione non lo blocca, blocca il motivo per cui viene usato: chi esce da un
  # dialog bloccante se lo ritrova aperto appena rientra, quindi il relog non serve a nulla.
  # Il permesso smplibrary.dialogguard.bypass esclude un player dalla riapertura.
  DIALOG-GUARD:
    enabled: true
    # Ritardo prima di rimostrare il dialog al login: il client sta ancora finendo di
    # entrare e un dialog inviato subito viene scartato. 20 tick = 1 secondo.
    reopen-delay-ticks: 20
    # Quante volte lo stesso dialog puo' tornare. Valvola di sicurezza: senza, un client
    # che non riesce a renderizzarlo terrebbe il player fuori dal server per sempre.
    max-reopens: 5
    # Dopo quanto un dialog rimasto senza risposta smette di essere riproposto.
    expire-seconds: 600

  # Aikar Commands (ACF) registration block. The CommandManager reads this
  # and registers the matching command classes. Aliases & permission live here
  # so a server owner can retune without touching code.
  COMMANDS:
    smplibrary:
      enabled: true
      name: smplibrary
      aliases: [smpl, sl]
      permission: smplibrary.admin
      messages:
        no-permission: "&cYou don't have permission."
        reload-success: "&aSMP-Library reloaded."
        unknown-sub: "&7Unknown subcommand. &f/smplibrary help"
    keyall:
      enabled: true
      name: keyall
      aliases: [keys]
      permission: smplibrary.keyall.use
      cooldown-seconds: 0
      messages:
        no-permission: "&cNo permission."
        ran: "&dKeyAll triggered for &f%players% &dplayers."
