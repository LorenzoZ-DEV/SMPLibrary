# Network timeouts for dependency resolution.
#
# Gradle defaults to 30s, which is not much margin when a repository is slow to answer —
# repo.papermc.io regularly takes ~10s from here, and a momentary hiccup on top of that
# surfaces as "Connection timed out: getsockopt" with a misleading suggestion about proxies.
# Raising these costs nothing on a healthy connection: they are ceilings, not delays.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Keep the daemon's JVM stable across builds.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
